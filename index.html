  <body>
    <div id="root"></div>
    <script>
      (function () {
        var STORAGE_KEY = 'shop-system:lang'
        var LANGS = ['ar', 'en', 'es', 'it', 'ro', 'fr', 'el', 'de']
        var DIR = { ar: 'rtl' }
        try {
          var v = localStorage.getItem(STORAGE_KEY)
          if (v && LANGS.indexOf(v) !== -1) {
            document.documentElement.lang = v
            document.documentElement.dir = DIR[v] || 'ltr'
          }
        } catch (e) {}
      })()
    </script>
  </body>
